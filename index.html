<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Beautiful Task Management</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">📋 TaskFlow</div>
            <div id="listContainer"></div>
            <button class="add-list-btn" onclick="createNewList()">+ New List</button>
        </div>

        <!-- Main Content -->
        <div class="main">
            <div class="header">
                <div>
                    <h1 id="currentListName">My Tasks</h1>
                    <div class="quote" id="quote">Stay focused and make it happen! 🌟</div>
                </div>
            </div>

            <div class="stats">
                <div class="stat-box">
                    <div class="stat-label">Total Tasks</div>
                    <div class="stat-value" id="totalTasks">0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Completed</div>
                    <div class="stat-value" id="completedTasks">0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Progress</div>
                    <div class="stat-value" id="progressPercent">0%</div>
                </div>
            </div>

            <div class="input-section">
                <input type="text" class="task-input" id="taskInput" placeholder="Add a new task..." />
                <button class="add-btn" onclick="addTask()">Add Task</button>
            </div>

            <div class="filters">
                <button class="filter-btn active" onclick="filterTasks('all')">All</button>
                <button class="filter-btn" onclick="filterTasks('pending')">Pending</button>
                <button class="filter-btn" onclick="filterTasks('completed')">Completed</button>
            </div>

            <div class="tasks-container" id="tasksContainer"></div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div class="modal" id="editModal">
        <div class="modal-content">
            <div class="modal-header">Edit Task</div>
            <form class="modal-form" onsubmit="saveEditedTask(event)">
                <div class="form-group">
                    <label class="form-label">Task Title</label>
                    <input type="text" class="form-input" id="editTitle" required />
                </div>
                <div class="form-group">
                    <label class="form-label">Description</label>
                    <textarea class="form-textarea" id="editDescription"></textarea>
                </div>
                <div class="form-group">
                    <label class="form-label">Date</label>
                    <input type="date" class="form-input" id="editDate" />
                </div>
                <div class="form-group">
                    <label class="form-label">Time</label>
                    <input type="time" class="form-input" id="editTime" />
                </div>
                <div class="modal-actions">
                    <button type="button" onclick="closeModal()">Cancel</button>
                    <button type="submit">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <!-- New List Modal -->
    <div class="modal" id="newListModal">
        <div class="modal-content">
            <div class="modal-header">Create New List</div>
            <form class="modal-form" onsubmit="saveNewList(event)">
                <div class="form-group">
                    <label class="form-label">List Name</label>
                    <input type="text" class="form-input" id="newListName" placeholder="e.g., Work, Personal, Shopping" required />
                </div>
                <div class="modal-actions">
                    <button type="button" onclick="closeModal()">Cancel</button>
                    <button type="submit">Create List</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Celebration Container -->
    <div class="celebration" id="celebration"></div>

    <script src="script.js"></script>
</body>
</html>
